name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual trigger so the owner can re-run post-deploy verification on demand,
  # e.g. after setting an env var the deploy was waiting on (#550).
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Opt JavaScript-based actions into Node 24 ahead of the June 2026
# deprecation of Node 20. The pinned major tags (checkout@v4, setup-python@v5,
# setup-node@v4) still ship Node 20 internally; this env forces them onto the
# runner's Node 24. See issue #71.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backend-test:
    name: backend-test
    runs-on: ubuntu-latest
    env:
      # Required by app.core.config.Settings at import time. Tests use SQLite
      # in-memory via conftest, so this URL is never actually dialled.
      DATABASE_URL: postgresql+psycopg://test:test@localhost/test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./backend[test]"

      - name: Run backend tests
        run: make backend-test

  # Model/migration drift guard (#839). `make backend-test` cannot see this
  # class of bug: the suite builds its schema with `create_all` from the models,
  # so a model edit that never got a migration passes every test and then fails
  # the production deploy (or, worse, silently runs prod on a schema the code no
  # longer describes). `alembic check` is the deterministic answer -- it walks
  # the migration history onto an empty database and diffs the result against
  # the model metadata. It runs against a real Postgres because that is the
  # engine production runs and the migrations use Postgres-only DDL.
  alembic-check:
    name: alembic-check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: coach
          POSTGRES_PASSWORD: coach
          POSTGRES_DB: coach
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://coach:coach@localhost:5432/coach
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      # Core deps only: alembic, SQLAlchemy and psycopg are runtime
      # dependencies, so the test extra buys nothing here. `psycopg[binary]` is
      # a CI-step-only addition, not a project dependency: this is the first CI
      # job that ever actually DIALS Postgres (the backend-test job's own
      # DATABASE_URL is never connected to -- conftest uses SQLite), and the
      # plain wheel is the pure-Python implementation, which loads whatever
      # libpq the runner image happens to ship. The binary extra bundles its
      # own, so the job cannot start failing on a runner-image change.
      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ./backend "psycopg[binary]"

      # Two steps rather than one `make` target so a broken MIGRATION and a
      # model/migration DIVERGENCE are distinguishable in the job log.
      - name: Apply migrations to an empty database
        run: cd backend && python -m alembic upgrade head

      - name: Check the models match the migrations
        run: cd backend && python -m alembic check

  frontend-test:
    name: frontend-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint + build
        run: npm run test

  # Post-deploy verification (#550): after a push to main triggers the Railway
  # deploy, poll the deployed /api/health until healthy then run the deployed
  # handshake smoke. A crashed or regressed deploy (the #546 outage, where prod
  # was down and only a human noticing the crash email caught it) now fails this
  # job, which alerts via GitHub's default failure notification. Does NOT run on
  # pull_request (no deploy to verify). Skips cleanly when PROD_BACKEND_URL is
  # unset, so the repo is not broken for anyone without prod access.
  post-deploy-verify:
    name: post-deploy-verify
    needs: [backend-test, frontend-test, alembic-check]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      SMOKE_BASE_URL: ${{ secrets.PROD_BACKEND_URL }}
      SMOKE_TELEGRAM_WEBHOOK_SECRET: ${{ secrets.PROD_TELEGRAM_WEBHOOK_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Check prod URL is configured
        id: guard
        run: |
          if [ -z "${SMOKE_BASE_URL}" ]; then
            echo "::notice::PROD_BACKEND_URL secret not set; skipping post-deploy verification."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.configured == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      # The verifier imports only httpx (it never imports the app), so the core
      # backend package is all it needs -- no DATABASE_URL, no test extra.
      - name: Install backend (for httpx + scripts)
        if: steps.guard.outputs.configured == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e ./backend

      - name: Verify the deploy is healthy
        if: steps.guard.outputs.configured == 'true'
        run: make post-deploy-verify
