[project]
name = "running-coach-backend"
version = "0.2.0"
description = "Running Coach Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.0",
    "psycopg>=3.1.0",
    "pydantic[email]>=2.6.0",
    "pydantic-settings>=2.1.0",
    "alembic>=1.13.0",
    "httpx>=0.26.0",
    "redis>=5.0.0",
    "rq>=1.16.0",
    "python-multipart>=0.0.9",
    "numpy>=1.24.0",
    "anthropic>=0.40.0",
    "pyjwt[crypto]>=2.8.0"
]

[project.optional-dependencies]
# Optional error tracking. Logs-only by default (issue #102); install this
# extra and set SENTRY_DSN to re-enable Sentry capture.
observability = [
    "sentry-sdk[fastapi]>=2.0.0"
]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    # Pull in the optional SDK so the suite can exercise the Sentry-present
    # path; production installs core deps only and relies on the import guard.
    "running-coach-backend[observability]"
]

[tool.pytest.ini_options]
markers = [
    "integration: requires local services or deeper cross-layer setup that is outside the stable global test baseline"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
