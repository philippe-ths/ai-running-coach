[project]
name = "running-coach-backend"
version = "0.2.0"
description = "Running Coach Backend"
requires-python = ">=3.11"
dependencies = [
    # BOUNDED DELIBERATELY (#809). FastAPI's router model is not a private
    # detail here: several security guards sweep the route table, and 0.141
    # changed `include_router` from flattening routes into `app.routes` to
    # wrapping them behind `_IncludedRouter`. Under the old unbounded
    # `>=0.109.0` a developer's venv sat on 0.128 while CI resolved 0.141, so a
    # local green run and a CI green run were not checking the same things --
    # and the session-gate fence inspected zero routes in CI while passing.
    # The floor makes local, CI and the deploy resolve one route model; the
    # ceiling means the next minor is adopted on purpose, after confirming
    # `tests/_route_table.py` still enumerates the app (its anti-vacuity test
    # will say so). `test_route_table.py` asserts the INSTALLED version
    # satisfies this line, so a stale venv is a failure rather than a surprise.
    "fastapi>=0.142.2,<0.143.0",
    "uvicorn[standard]>=0.27.0",
    # BOUNDED DELIBERATELY (#1021). SQLAlchemy 2.1 stopped installing `greenlet`
    # by default, and `alembic/env.py` imports `sqlalchemy.ext.asyncio`, which
    # refuses to load without it. Unbounded at `>=2.0.0`, CI resolved 2.1.1 on
    # 29 Sep 2026 and `alembic-check` failed on every PR, while `backend-test`
    # stayed green because the suite builds its schema with `create_all` and
    # never imports env.py. The same image would fail the pre-deploy
    # `alembic upgrade head`. The ceiling means 2.1 is adopted on purpose, run
    # against the suite and a real migration first. `test_sqlalchemy_pin_1021.py`
    # asserts the INSTALLED version satisfies this line.
    "sqlalchemy>=2.0.0,<2.1",
    "psycopg>=3.1.0",
    "pydantic[email]>=2.6.0",
    "pydantic-settings>=2.1.0",
    "alembic>=1.13.0",
    "httpx>=0.26.0",
    "redis>=5.0.0",
    "rq>=1.16.0",
    "python-multipart>=0.0.9",
    "numpy>=1.24.0",
    # BOUNDED DELIBERATELY (#966, #1023), the `fastapi` precedent above applied
    # to the other dependency whose surface we call directly. An unbounded floor
    # let 1.0.0 in unannounced on 24 Aug 2026: it removed `temperature` from
    # `messages.create()`/`.stream()` and every coach lane but the report went
    # down while CI stayed green. The ceiling means the next major is adopted on
    # purpose, as 1.x was. `test_anthropic_sdk_binding_1023.py` drives the real
    # SDK so a signature change fails the build; `test_anthropic_pin_966.py`
    # asserts the INSTALLED version satisfies this line.
    "anthropic>=1.9.0,<2.0.0",
    # Declared because `RetryLadder` names `httpx2.RemoteProtocolError`: the
    # SDK's HTTP layer since 1.0.0, whose exception classes are unrelated to
    # `httpx`'s, and which a mid-stream disconnect raises unwrapped (#302).
    # Matches the range `anthropic` itself requires.
    "httpx2>=2.0.0,<3",
    "pyjwt[crypto]>=2.8.0",
    # #555: unofficial Garmin Connect client for the owner-only recovery sync
    # (Garmin's official Health API is closed to new applicants). Minor-pinned
    # because an unofficial client breaks on Garmin's side without notice; it is
    # imported lazily by `services/recovery/garmin_adapter.py` only. MIT.
    "garminconnect>=0.3.2,<0.4"
]

[project.optional-dependencies]
# Optional error tracking. Logs-only by default (issue #102); install this
# extra and set SENTRY_DSN to re-enable Sentry capture.
observability = [
    "sentry-sdk[fastapi]>=2.0.0"
]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    # Pull in the optional SDK so the suite can exercise the Sentry-present
    # path; production installs core deps only and relies on the import guard.
    "running-coach-backend[observability]"
]

[tool.pytest.ini_options]
markers = [
    "integration: requires local services or deeper cross-layer setup that is outside the stable global test baseline"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
